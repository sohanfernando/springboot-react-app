spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/userDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is changed only by the versioned scripts in db/migration (Flyway).
# Hibernate just checks at startup that the tables match the entities, and
# refuses to start if they do not, instead of quietly altering the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# A database that already has tables but no migration history is recorded as
# being at V1 (the baseline) and then brought up to date from V2 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=64MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/

app.stripe.secret-key=${STRIPE_SECRET_KEY:YOUR_STRIPE_SECRET_KEY}

# Signs login tokens. Must be at least 32 characters and kept secret; set it in .env.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=720
# Browser origins allowed to call this API, comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Optional: creates the first administrator at startup if that email is not registered.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}