spring.datasource.url=jdbc:mysql://localhost:3306/userDB_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Stripe. Only the secret key is read by the server.
app.stripe.secret-key=${STRIPE_SECRET_KEY:YOUR_STRIPE_SECRET_KEY}
app.cors.allowed-origins=http://localhost:5173

# Tests sign up many accounts from one address; the real limit is tested in RateLimitIntegrationTest.
app.signup.max-per-hour=1000000
# Tests build their schema from schema.sql or Hibernate, not from the MySQL migrations.
spring.flyway.enabled=false
